<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>슈가 &amp; 카페인 디텍터</title>
<style>
  :root {
    --bg: #fff8f0;
    --card: #ffffff;
    --text: #2b2b2b;
    --sub: #6b6b6b;
    --sugar: #ff8fab;
    --caffeine: #8b5e3c;
    --btn: #ff7a59;
    --btn-hover: #f2603c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a19;
      --card: #2a2725;
      --text: #f4f1ee;
      --sub: #b8b1ab;
      --caffeine: #d2a074;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    word-break: keep-all;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 28px;
    padding: 48px 28px 36px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  }
  .icons {
    font-size: 56px;
    margin-bottom: 20px;
    letter-spacing: 8px;
  }
  .icons span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .icons span:nth-child(2) { animation-delay: 0.3s; }
  .icons span:nth-child(3) { animation-delay: 0.6s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  h1 {
    font-size: 30px;
    line-height: 1.3;
    font-weight: 800;
    margin-bottom: 14px;
  }
  h1 .sugar { color: var(--sugar); }
  h1 .caffeine { color: var(--caffeine); }
  p {
    font-size: 17px;
    line-height: 1.6;
    color: var(--sub);
    margin-bottom: 36px;
  }
  button {
    width: 100%;
    padding: 18px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    background: var(--btn);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.97); }
  @media (prefers-reduced-motion: reduce) {
    .icons span { animation: none; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icons" aria-hidden="true"><span>🥤</span><span>🔍</span><span>☕</span></div>
    <h1><span class="sugar">슈가</span> &amp; <span class="caffeine">카페인</span><br>디텍터</h1>
    <p>내가 마신 음료 속 당과 카페인, 얼마나 들어 있는지 찾아볼까요?</p>
    <button type="button" id="startBtn">시작</button>
  </main>

<script>
  document.getElementById('startBtn').addEventListener('click', function () {
    alert('준비 중입니다! 조금만 기다려 주세요 😊');
  });
</script>
</body>
</html>
